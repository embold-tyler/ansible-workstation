# --- Desktop / GUI ------------------------------------------------------
# Policy: prefer an RPM over a flatpak whenever the vendor ships one. The
# flatpak builds of Chrome and 1Password installed from GNOME Software came
# up sandboxed with too little filesystem access (no ~/.local/share
# integration, no browser<->1Password native messaging).
packages_desktop_fedora:
  - 1password
  - 1password-cli
  - adw-gtk3-theme
  - cloudflare-warp
  - gimp
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-gsconnect
  - gnome-tweaks
  - google-chrome-stable
  - nautilus-open-any-terminal
  - openssh-askpass     # GUI sudo/ssh prompts when there is no tty
  - playerctl
  - seahorse
  - xdg-terminal-exec

# Chrome and 1Password are RPMs (see packages_desktop_fedora).
packages_flatpak:
  - com.github.huluti.Curtail
  - com.mattjakeman.ExtensionManager
  - com.slack.Slack
  - fr.handbrake.ghb
  - io.beekeeperstudio.Studio
  - io.github.seadve.Kooha
  - org.filezillaproject.Filezilla
  - org.gnome.Extensions
  - org.libreoffice.LibreOffice
  - org.mozilla.Thunderbird
  - org.videolan.VLC

nerd_font_version: "v3.3.0"
nerd_font_name: "FiraCode"

# Screaming Frog publishes no "latest" URL, so this is pinned. Bump it from
# https://www.screamingfrog.co.uk/seo-spider/ when a new release lands.
screamingfrog_version: "24.3-1"

# --- Terminal -----------------------------------------------------------
# Tabby ships no repo, so it comes from its GitHub release (see desktop role).
# Its config.yaml is chezmoi-managed in the dotfiles repo, not templated here.
terminal_desktop_id: "tabby.desktop"
terminal_exec: "/opt/Tabby/tabby"

# --- Launcher -----------------------------------------------------------
vicinae_version: "0.29.0"
vicinae_appimage_url: "https://github.com/vicinaehq/vicinae/releases/download/v{{ vicinae_version }}/Vicinae-x86_64.AppImage"
vicinae_bin: "{{ user_home }}/.local/bin/vicinae"

