---
# Fedora package names below were verified against live Fedora 44 repos.
# Ubuntu names are best-effort and untested — see README.

user_name: "{{ lookup('env', 'USER') }}"
user_home: "{{ lookup('env', 'HOME') }}"

dotfiles_repo: "git@github.com:embold-tyler/dotfiles.git"
coder_url: "https://coder.embold.dev"

# --- Base CLI -----------------------------------------------------------
packages_base_fedora:
  - 7zip
  - bat
  - btop
  - chezmoi
  - curl
  - direnv
  - eza
  - fastfetch
  - fd-find
  - fzf
  - git
  - git-delta
  - htop
  - jq
  - just
  - ncdu
  - openvpn
  - pandoc-cli
  - ripgrep
  - snapper
  - tailscale
  - tealdeer
  - tmux
  - util-linux
  - vim-enhanced
  - wget2-wget
  - wl-clipboard
  - xclip
  - zoxide
  - zsh

packages_base_ubuntu:
  - bat
  - btop
  - curl
  - direnv
  - eza
  - fastfetch
  - fd-find
  - fzf
  - git
  - git-delta
  - htop
  - jq
  - just
  - openvpn
  - p7zip-full
  - pandoc
  - ripgrep
  - tealdeer
  - tmux
  - vim
  - wget
  - wl-clipboard
  - xclip
  - zoxide
  - zsh

# --- Development --------------------------------------------------------
packages_dev_fedora:
  - code
  - composer
  - gh
  - golang
  - lazygit
  - nss-tools        # certutil, so browsers trust the lerd CA
  - php
  - php-cli
  - podman
  - podman-compose
  - podman-docker
  - python3
  - python3-pip
  - shfmt

packages_dev_ubuntu:
  - code
  - composer
  - gh
  - golang
  - libnss3-tools    # certutil, so browsers trust the lerd CA
  - php
  - php-cli
  - podman
  - podman-compose
  - python3
  - python3-pip
  - shfmt

# --- Desktop / GUI ------------------------------------------------------
# Policy: prefer an RPM over a flatpak whenever the vendor ships one. The
# flatpak builds of Chrome and 1Password installed from GNOME Software came
# up sandboxed with too little filesystem access (no ~/.local/share
# integration, no browser<->1Password native messaging).
packages_desktop_fedora:
  - 1password
  - 1password-cli
  - adw-gtk3-theme
  - cloudflare-warp
  - dejavu-sans-fonts
  - dejavu-sans-mono-fonts
  - dejavu-serif-fonts
  - gimp
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-gsconnect
  - gnome-tweaks
  - google-chrome-stable
  - nautilus-python
  - openssh-askpass     # GUI sudo/ssh prompts when there is no tty
  - playerctl
  - ptyxis
  - remmina
  - remmina-plugins-rdp
  - remmina-plugins-secret
  - seahorse
  - xdg-terminal-exec

# Chrome and 1Password are RPMs (see packages_desktop_fedora).
packages_flatpak:
  - com.github.tchx84.Flatseal
  - com.github.huluti.Curtail
  - com.mattjakeman.ExtensionManager
  - com.slack.Slack
  - eu.betterbird.Betterbird
  - fr.handbrake.ghb
  - io.github.seadve.Kooha
  - io.github.tobagin.Ntfyr
  - io.gitlab.theevilskeleton.Upscaler
  - io.podman_desktop.PodmanDesktop
  - org.filezillaproject.Filezilla
  - org.gnome.Extensions
  - org.gnome.gThumb
  - org.gnome.World.PikaBackup
  - org.kde.okular
  - org.libreoffice.LibreOffice
  - org.videolan.VLC

nerd_font_name: "FiraCode"

# Screaming Frog publishes no "latest" URL, so this is pinned. Bump it from
# https://www.screamingfrog.co.uk/seo-spider/ when a new release lands.
screamingfrog_version: "24.3-1"

# Pinned so the MCP config in dotfiles (env var names) can't silently drift
# from the binary. Releases: https://github.com/portainer/portainer-mcp/releases
portainer_mcp_version: "2.45.1"

# lerd (Podman-based PHP environment). Releases: https://github.com/lerd-env/lerd/releases
# After first install, `lerd update` keeps it current; this only seeds new machines.
lerd_version: "1.39.2"

# --- Terminal -----------------------------------------------------------
terminal_desktop_id: "org.gnome.Ptyxis.desktop"
terminal_exec: "/usr/bin/ptyxis"

# --- Launcher -----------------------------------------------------------
vicinae_appimage_url: "https://github.com/vicinaehq/vicinae/releases/latest/download/Vicinae-x86_64.AppImage"

# --- Dock ----------------------------------------------------------------
# Pin order as set on the desktop.
#   Edit this list (not gsettings) to change it so a reprovision 
#   doesn't drift from what's actually pinned.
gnome_favorite_apps:
  - org.gnome.Nautilus.desktop                                # File Explorer
  - org.gnome.Ptyxis.desktop                                  # Terminal
  - org.mozilla.firefox.desktop
  - google-chrome.desktop
  - com.slack.Slack.desktop
  - com.microsoft.VSCode.desktop
  - lmstudio.desktop                                          # no Windows-pin equivalent
  - google-chrome-personal.desktop                            # Chrome (Personal)
  - com.cloudflare.WarpTaskbar.desktop
  - org.gnome.Calendar.desktop                                # no Windows-pin equivalent kept
  - com.onepassword.OnePassword.desktop                       # no Windows-pin equivalent
  - org.gnome.Software.desktop                                # no Windows-pin equivalent

# --- GNOME extensions ---------------------------------------------------
# All from extensions.gnome.org, so every extension lands in one place
# (~/.local/share/gnome-shell/extensions) with one update path. Fedora does
# package Caffeine, but the RPM installs system-wide and would shadow/duplicate
# a user copy. `tag` is the EGO version_tag for the GNOME 50 build.
# Emoji Selector (1162) is deliberately absent: it stops at GNOME 43.
gnome_extensions_ego:
  - { name: 'Night Theme Switcher', uuid: 'nightthemeswitcher@romainvigier.fr', tag: 76543 }
  - { name: 'Caffeine',                          uuid: 'caffeine@patapon.info',         tag: 69851 }
  - { name: 'Emoji Copy',                        uuid: 'emoji-copy@felipeftn',          tag: 74180 }
  # Required for Vicinae's clipboard history
  - { name: 'Vicinae (clipboard bridge)',        uuid: 'vicinae@dagimg-dot',            tag: 74338 }
  # Windows-style edge/side snapping; stock GNOME only does full-maximize.
  - { name: 'Tiling Assistant',                  uuid: 'tiling-assistant@leleat-on-github', tag: 68287 }

  - { name: 'Lock Keys', uuid: 'lockkeys@vaina.lt', tag: 75259 }
  - { name: 'Shotzy', uuid: 'shotzy@SamkitJain660.github.io', tag: 71980 }
  - { name: 'Always Show Titles In Overview', uuid: 'Always-Show-Titles-In-Overview@gmail.com', tag: 75235 }

gnome_extensions_enable:
  - nightthemeswitcher@romainvigier.fr
  - caffeine@patapon.info
  - emoji-copy@felipeftn
  - vicinae@dagimg-dot
  - tiling-assistant@leleat-on-github

  - lockkeys@vaina.lt
  - gaze@gundulabs.com
  - shotzy@SamkitJain660.github.io
  - Always-Show-Titles-In-Overview@gmail.com

# --- Keyboard shortcuts -------------------------------------------------
# Conflicts cleared first, then assignments. Every "free" entry below was a
# real collision found on this machine.
gnome_keybinding_conflicts:
  # Super+V was the message tray; keep Super+M for that.
  - { schema: 'org.gnome.shell.keybindings',          key: 'toggle-message-tray', value: "['<Super>n']" }
  # Super+Tab cycled windows of one app; move that to the usual Super+grave.
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-group',        value: "['<Super>grave']" }
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-group-backward', value: "['<Shift><Super>grave']" }
  # ibus owns Super+period for emoji; hand it to Emoji Copy instead.
  - { schema: 'org.freedesktop.ibus.panel.emoji',     key: 'hotkey',              value: "[]" }
  # Super+Shift+Up moved "move window to monitor above" out of the way so
  # Tiling Assistant's vertical-maximize can use it (matches Windows).
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'move-to-monitor-up', value: "['<Control><Super>Up']" }
  # Only one keyboard layout here, so Super+space is free for the launcher.
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-input-source', value: "[]" }
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-input-source-backward', value: "[]" }

gnome_keybindings:
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'maximize-vertically', value: "[]" }
  - { schema: 'org.gnome.desktop.wm.preferences', key: 'action-middle-click-titlebar', value: "'toggle-maximize-vertically'" }
  # Windows-like: Alt+Tab = applications, Super+Tab = individual windows.
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-applications',          value: "['<Super>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-applications-backward', value: "['<Shift><Super>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-windows',               value: "['<Alt>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-windows-backward',      value: "['<Shift><Alt>Tab']" }
  # Windows-like workspace switching: Ctrl+Super+Left/Right
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-to-workspace-left',     value: "['<Control><Super>Left', '<Super>Page_Up', '<Control><Alt>Left']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-to-workspace-right',    value: "['<Control><Super>Right', '<Super>Page_Down', '<Control><Alt>Right']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'move-to-workspace-left',       value: "['<Control><Shift><Super>Left', '<Super><Shift>Page_Up']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'move-to-workspace-right',      value: "['<Control><Shift><Super>Right', '<Super><Shift>Page_Down']" }

# Extension schemas are NOT on the default gsettings path, so each needs
# --schemadir pointing at its own extension directory. Without it these
# silently do nothing.
gnome_extension_settings:
  - { uuid: 'lockkeys@vaina.lt', schema: 'org.gnome.shell.extensions.lockkeys', key: 'capslock-indicator', value: "'when-active'" }
  - { uuid: 'lockkeys@vaina.lt', schema: 'org.gnome.shell.extensions.lockkeys', key: 'capslock-notification', value: "'osd'" }
  - { uuid: 'lockkeys@vaina.lt', schema: 'org.gnome.shell.extensions.lockkeys', key: 'numlock-notification', value: "'osd'" }
  - { uuid: 'tiling-assistant@leleat-on-github', schema: 'org.gnome.shell.extensions.tiling-assistant', key: 'enable-advanced-experimental-features', value: 'true' }
  - { uuid: 'tiling-assistant@leleat-on-github', schema: 'org.gnome.shell.extensions.tiling-assistant', key: 'show-layout-panel-indicator', value: 'true' }
  - { uuid: 'vicinae@dagimg-dot', schema: 'org.gnome.shell.extensions.vicinae', key: 'show-status-indicator', value: 'false' }
  - { uuid: 'shotzy@SamkitJain660.github.io', schema: 'org.gnome.shell.extensions.shotzy', key: 'ocr-enabled', value: 'true' }
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'emoji-keybind',        value: "['<Super>period']" }
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'window-location',      value: "'cursor'" }
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'active-keybind',       value: "true" }
  - { uuid: 'caffeine@patapon.info',         schema: 'org.gnome.shell.extensions.caffeine',         key: 'toggle-shortcut',      value: "['<Super><Shift>k']" }
  # Windows' "resize to top edge" behavior: full height, width unchanged.
  - { uuid: 'tiling-assistant@leleat-on-github', schema: 'org.gnome.shell.extensions.tiling-assistant', key: 'tile-maximize-vertically', value: "['<Super><Shift>Up']" }
  - { uuid: 'Always-Show-Titles-In-Overview@gmail.com', schema: 'org.gnome.shell.extensions.always-show-titles-in-overview', key: 'window-title-position', value: "'Center'" }
  # GTK3 ignores GNOME's color-scheme, so switch gtk-theme alongside it.
  - { uuid: 'nightthemeswitcher@romainvigier.fr', schema: 'org.gnome.shell.extensions.nightthemeswitcher.commands', key: 'enabled', value: 'true' }
  - { uuid: 'nightthemeswitcher@romainvigier.fr', schema: 'org.gnome.shell.extensions.nightthemeswitcher.commands', key: 'sunrise', value: 'gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3' }
  - { uuid: 'nightthemeswitcher@romainvigier.fr', schema: 'org.gnome.shell.extensions.nightthemeswitcher.commands', key: 'sunset',  value: 'gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark' }

# Custom keybindings (name / command / binding).
gnome_custom_keybindings:
  - { name: 'Vicinae launcher',           command: "{{ user_home }}/AppImages/vicinae.appimage toggle",                          binding: '<Super>space' }
  - { name: 'Vicinae clipboard history',  command: "{{ user_home }}/.local/bin/vicinae-clipboard-toggle",                        binding: '<Super>v' }
  - { name: 'Toggle light/dark',          command: "{{ user_home }}/.local/bin/toggle-color-scheme",                     binding: '<Super><Shift>d' }
  - { name: 'Colour picker',              command: 'gcolor3',                                                            binding: '<Super><Shift>c' }
  - { name: 'Espanso Search',             command: 'espanso cmd search',                                                 binding: '<Alt><Shift>space' }

# --- Disk encryption ----------------------------------------------------
# PCR 7 only: PCR 0 measures firmware, so a BIOS update would invalidate the
# TPM2 binding and force a re-enrolment on every firmware update.
luks_tpm2_pcrs: "7"


# --- Face unlock (Gaze) -------------------------------------------------
# USB vendor:product, not a port path, so the camera survives moving between
# the dock and the laptop. Gaze picks the colour and IR nodes from it.
gaze_camera_usb_id: "046d:085e"  # Logitech BRIO

# --- macOS ----------------------------------------------------------------
# Apple Silicon prefix. Homebrew (and so Ansible) must already be installed,
# see README "macOS".
homebrew_prefix: "/opt/homebrew"

# packages_base_fedora minus what macOS ships (curl, zsh) or has no use for
# (snapper, util-linux, wl-clipboard/xclip: pbcopy/pbpaste are built in).
packages_base_macos:
  - bat
  - btop
  - chezmoi
  - direnv
  - dockutil
  - eza
  - fastfetch
  - fd
  - fzf
  - git
  - git-delta
  - htop
  - jq
  - just
  - ncdu
  - openvpn
  - pandoc
  - ripgrep
  - sevenzip
  - tealdeer
  - tmux
  - vim
  - wget
  - zoxide

# No php/composer: Herd ships both. No nss-tools: that was for lerd's CA.
packages_dev_macos:
  - cloudflared
  - fnm
  - gh
  - go
  - lazygit
  - podman
  - podman-compose
  - shfmt

# Linux app → Mac equivalent where the name differs:
#   Ptyxis → iterm2, Vicinae/Emoji Copy/Caffeine/espanso → raycast,
#   lerd → herd, Remmina → windows-app, FileZilla → cyberduck,
#   Curtail → imageoptim, Upscaler → upscayl. Dropped (built in or not needed):
#   Betterbird (Apple Mail), Kooha (Cmd+Shift+5), Okular/gThumb (Preview),
#   Pika Backup (Time Machine), GSConnect/RQuickShare (Quick Share ↔ AirDrop).
macos_casks:
  - 1password
  - 1password-cli
  - balenaetcher
  - claude
  - clickup
  - cloudflare-warp
  - cyberduck
  - firefox
  - font-fira-code-nerd-font
  - gimp
  - google-chrome
  - handbrake-app
  - herd
  - imageoptim
  - iterm2
  - libreoffice
  - lm-studio
  - podman-desktop
  - raycast
  - screaming-frog-seo-spider
  - slack
  - tailscale-app
  - upscayl
  - visual-studio-code
  - vlc
  - windows-app

# Apps with no Homebrew cask. Both self-update after the first install.
macos_download_apps:
  - { name: Keito,    app: Keito.app,    url: "https://github.com/osodevops/keito-desktop-releases/releases/latest/download/Keito-universal.dmg" }
  - { name: Rustable, app: Rustable.app, url: "https://github.com/RustableApp/Rustable/releases/latest/download/Rustable-macos-arm64.zip" }

# Dock pin order, mirroring gnome_favorite_apps. Finder is always first.
macos_dock_apps:
  - /Applications/iTerm.app
  - /Applications/Firefox.app
  - /Applications/Google Chrome.app
  - /Applications/Slack.app
  - /Applications/Visual Studio Code.app
  - /Applications/LM Studio.app
  - /System/Applications/Calendar.app
  - /Applications/1Password.app
  - /System/Applications/App Store.app

# Workspace (Space) switching to match Ctrl+Super+Left/Right on GNOME. A PC
# keyboard's Win key is Cmd on macOS, so this is the same physical chord.
# ids: 79/81 = move left/right a space, 64 = Spotlight (freed for Raycast).
# parameters: (char, keycode, modifier mask); 123/124 = Left/Right arrow,
# 9699328 = Ctrl + Cmd + function-key flag.
macos_symbolic_hotkeys:
  - { id: 79, enabled: true,  parameters: [65535, 123, 9699328] }
  - { id: 81, enabled: true,  parameters: [65535, 124, 9699328] }
  - { id: 64, enabled: false, parameters: [32, 49, 1048576] }

# Ptyxis was 10.5pt on GNOME; macOS points render smaller.
iterm_font: "FiraCodeNFM-Reg 13"
iterm_profile_guid: "045D4175-6D70-4506-8729-48EC8A1F77AB"
