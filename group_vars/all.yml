# --- GNOME extensions ---------------------------------------------------
# All from extensions.gnome.org, so every extension lands in one place
# (~/.local/share/gnome-shell/extensions) with one update path. Fedora does
# package Caffeine, but the RPM installs system-wide and would shadow/duplicate
# a user copy. `tag` is the EGO version_tag for the GNOME 50 build.
# Emoji Selector (1162) is deliberately absent: it stops at GNOME 43.
gnome_extensions_ego:
  - { name: 'Night Theme Switcher', uuid: 'nightthemeswitcher@romainvigier.fr', tag: 76543 }
  - { name: 'Caffeine',                          uuid: 'caffeine@patapon.info',         tag: 69851 }
  - { name: 'Emoji Copy',                        uuid: 'emoji-copy@felipeftn',          tag: 74180 }
  - { name: 'Native Screenshot UI OCR Extended', uuid: 'ocr-to-clipboard@oreocapybara', tag: 72660 }
  # Required for Vicinae's clipboard history
  - { name: 'Vicinae (clipboard bridge)',        uuid: 'vicinae@dagimg-dot',            tag: 74338 }
  # Windows-style edge/side snapping; stock GNOME only does full-maximize.
  - { name: 'Tiling Assistant',                  uuid: 'tiling-assistant@leleat-on-github', tag: 68287 }

gnome_extensions_enable:
  - nightthemeswitcher@romainvigier.fr
  - caffeine@patapon.info
  - emoji-copy@felipeftn
  - ocr-to-clipboard@oreocapybara
  - vicinae@dagimg-dot
  - tiling-assistant@leleat-on-github

# --- Keyboard shortcuts -------------------------------------------------
# Conflicts cleared first, then assignments. Every "free" entry below was a
# real collision found on this machine.
gnome_keybinding_conflicts:
  # Super+V was the message tray; keep Super+M for that.
  - { schema: 'org.gnome.shell.keybindings',          key: 'toggle-message-tray', value: "['<Super>n']" }
  # Super+Tab cycled windows of one app; move that to the usual Super+grave.
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-group',        value: "['<Super>grave']" }
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-group-backward', value: "['<Shift><Super>grave']" }
  # ibus owns Super+period for emoji; hand it to Emoji Copy instead.
  - { schema: 'org.freedesktop.ibus.panel.emoji',     key: 'hotkey',              value: "[]" }
  # Super+Shift+Up moved "move window to monitor above" out of the way so
  # Tiling Assistant's vertical-maximize can use it (matches Windows).
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'move-to-monitor-up', value: "['<Control><Super>Up']" }
  # Only one keyboard layout here, so Super+space is free for the launcher.
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-input-source', value: "[]" }
  - { schema: 'org.gnome.desktop.wm.keybindings',     key: 'switch-input-source-backward', value: "[]" }

gnome_keybindings:
  # Windows-like: Alt+Tab = applications, Super+Tab = individual windows.
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-applications',          value: "['<Super>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-applications-backward', value: "['<Shift><Super>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-windows',               value: "['<Alt>Tab']" }
  - { schema: 'org.gnome.desktop.wm.keybindings', key: 'switch-windows-backward',      value: "['<Shift><Alt>Tab']" }

# Extension schemas are NOT on the default gsettings path, so each needs
# --schemadir pointing at its own extension directory. Without it these
# silently do nothing.
gnome_extension_settings:
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'emoji-keybind',        value: "['<Super>period']" }
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'window-location',      value: "'cursor'" }
  - { uuid: 'emoji-copy@felipeftn',          schema: 'org.gnome.shell.extensions.emoji-copy',       key: 'active-keybind',       value: "true" }
  - { uuid: 'ocr-to-clipboard@oreocapybara', schema: 'org.gnome.shell.extensions.ocr-to-clipboard', key: 'capture-ocr-shortcut', value: "['<Super><Shift>o']" }
  - { uuid: 'caffeine@patapon.info',         schema: 'org.gnome.shell.extensions.caffeine',         key: 'toggle-shortcut',      value: "['<Super><Shift>k']" }
  # Windows' "resize to top edge" behavior: full height, width unchanged.
  - { uuid: 'tiling-assistant@leleat-on-github', schema: 'org.gnome.shell.extensions.tiling-assistant', key: 'tile-maximize-vertically', value: "['<Super><Shift>Up']" }

# Custom keybindings (name / command / binding).
gnome_custom_keybindings:
  - { name: 'Vicinae launcher',           command: "{{ user_home }}/.local/bin/vicinae toggle",                          binding: '<Super>space' }
  - { name: 'Vicinae clipboard history',  command: "{{ user_home }}/.local/bin/vicinae cmd launch clipboard:history",    binding: '<Super>v' }
  - { name: 'Toggle light/dark',          command: "{{ user_home }}/.local/bin/toggle-color-scheme",                     binding: '<Super><Shift>d' }
  - { name: 'Colour picker',              command: 'gcolor3',                                                            binding: '<Super><Shift>c' }

# --- Disk encryption ----------------------------------------------------
# PCR 7 only: PCR 0 measures firmware, so a BIOS update would invalidate the
# TPM2 binding and force a re-enrolment on every firmware update.
luks_tpm2_pcrs: "7"

# --- Face unlock --------------------------------------------------------
howdy_copr: "principis/howdy"
