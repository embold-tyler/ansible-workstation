---
- name: rebuild font cache
  ansible.builtin.command: fc-cache -f
  changed_when: true

- name: rebuild icon cache
  become: false
  ansible.builtin.command: "gtk-update-icon-cache -f -t {{ user_home }}/.local/share/icons/hicolor"
  changed_when: true

- name: restart nautilus
  become: false
  ansible.builtin.command: nautilus -q
  changed_when: true
  failed_when: false
