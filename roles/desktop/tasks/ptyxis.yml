---
- name: Ensure Ptyxis palette directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/org.gnome.Ptyxis/palettes"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'

- name: Install Catppuccin dual-mode palette for Ptyxis
  ansible.builtin.copy:
    src: ptyxis-catppuccin.palette
    dest: "{{ user_home }}/.local/share/org.gnome.Ptyxis/palettes/Catppuccin.palette"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'

- name: Configure host Ptyxis interface settings
  become: false
  ansible.builtin.command: "gsettings set {{ item }}"
  loop:
    - "org.gnome.Ptyxis use-system-font false"
    - "org.gnome.Ptyxis font-name 'FiraCode Nerd Font Mono 10.5'"
    - "org.gnome.Ptyxis interface-style 'system'"
    - "org.gnome.Ptyxis default-columns 125"
    - "org.gnome.Ptyxis default-rows 38"
    - "org.gnome.Ptyxis restore-window-size false"
    - "org.gnome.Ptyxis.Shortcuts undo-close-tab '<ctrl><shift>z'"
  changed_when: false
  failed_when: false

- name: Ensure icon theme directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'
  loop:
    - "{{ user_home }}/.local/share/icons/hicolor/scalable/apps"
    - "{{ user_home }}/.local/share/icons/hicolor/symbolic/apps"

- name: Install green leaf Ptyxis icons
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
  loop:
    - src: org.gnome.Ptyxis.svg
      dest: "{{ user_home }}/.local/share/icons/hicolor/scalable/apps/org.gnome.Ptyxis.svg"
    - src: org.gnome.Ptyxis-symbolic.svg
      dest: "{{ user_home }}/.local/share/icons/hicolor/symbolic/apps/org.gnome.Ptyxis-symbolic.svg"

- name: Install custom host Ptyxis desktop entry
  ansible.builtin.copy:
    dest: "{{ user_home }}/.local/share/applications/org.gnome.Ptyxis.desktop"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=Ptyxis
      GenericName=Terminal
      Comment=A container-oriented terminal for GNOME
      Exec=ptyxis
      Icon=org.gnome.Ptyxis
      StartupNotify=true
      Terminal=false
      Type=Application
      Categories=GNOME;GTK;System;TerminalEmulator;
      Keywords=terminal;prompt;ptyxis;shell;command;commandline;cmd;cli;console;container;podman;toolbox;distrobox;
      Actions=new-window;new-tab;preferences;
      X-ExecArg=--
      X-TerminalArgTitle=--title
      X-TerminalArgDir=--working-directory
      X-TerminalArgAppId=--gapplication-app-id

      [Desktop Action new-window]
      Name=New Window
      Exec=ptyxis --new-window

      [Desktop Action new-tab]
      Name=New Tab
      Exec=ptyxis --tab

      [Desktop Action preferences]
      Name=Preferences
      Exec=ptyxis --preferences

- name: Configure host Ptyxis default profile theme and opacity
  become: false
  ansible.builtin.shell: |
    UUID=$(gsettings get org.gnome.Ptyxis default-profile-uuid | tr -d "'")
    if [ -z "$UUID" ]; then
      UUID="c6e2ed4b8b4a6fa2cd1319d86aaccea8"
      gsettings set org.gnome.Ptyxis default-profile-uuid "$UUID"
      gsettings set org.gnome.Ptyxis profile-uuids "['$UUID']"
    fi
    gsettings set "org.gnome.Ptyxis.Profile:/org/gnome/Ptyxis/Profiles/$UUID/" palette 'Catppuccin'
    gsettings set "org.gnome.Ptyxis.Profile:/org/gnome/Ptyxis/Profiles/$UUID/" opacity 0.95
  changed_when: false
  failed_when: false

- name: Remove redundant Flatpak Ptyxis
  community.general.flatpak:
    name: app.devsuite.Ptyxis
    state: absent
  ignore_errors: true
