---
- name: Ensure Ghostty config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/ghostty"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'

- name: Install Ghostty configuration
  ansible.builtin.copy:
    src: ghostty.config
    dest: "{{ user_home }}/.config/ghostty/config"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'

- name: Remove Ghostty Nautilus extension
  become: true
  ansible.builtin.file:
    path: /usr/share/nautilus-python/extensions/ghostty.py
    state: absent
