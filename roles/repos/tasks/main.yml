---
# ---------------------------------------------------------------- Fedora
- name: Fedora third-party repositories
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Enable RPM Fusion (free + nonfree)
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Add Google Chrome repository
      ansible.builtin.yum_repository:
        name: google-chrome
        description: google-chrome
        baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
        gpgcheck: true
        gpgkey: https://dl.google.com/linux/linux_signing_key.pub

    - name: Add 1Password repository
      ansible.builtin.yum_repository:
        name: 1password
        description: 1Password Stable Channel
        baseurl: https://downloads.1password.com/linux/rpm/stable/$basearch
        gpgcheck: true
        gpgkey: https://downloads.1password.com/linux/keys/1password.asc

    - name: Add GitHub CLI repository
      ansible.builtin.yum_repository:
        name: gh-cli
        description: packages for the GitHub CLI
        baseurl: https://cli.github.com/packages/rpm
        gpgcheck: true
        gpgkey: https://cli.github.com/packages/githubcli-archive-keyring.asc

    - name: Add VS Code repository
      ansible.builtin.yum_repository:
        name: code
        description: Visual Studio Code
        baseurl: https://packages.microsoft.com/yumrepos/vscode
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc

    - name: Add Cloudflare WARP repository
      ansible.builtin.get_url:
        url: https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
        dest: /etc/yum.repos.d/cloudflare-warp.repo
        mode: '0644'

    - name: Add Tailscale repository
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg

    - name: Enable COPR repositories
      ansible.builtin.command: "dnf -y copr enable {{ item.repo }}"
      args:
        creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.file }}.repo"
      loop:
        - { repo: 'atim/lazygit', file: 'atim:lazygit' }
        - { repo: 'eclipseo/espanso', file: 'eclipseo:espanso' }
        - { repo: 'codifryed/CoolerControl', file: 'codifryed:CoolerControl' }
        # Official copr, maintained by the WezTerm author, tracks main.
        - { repo: 'wezfurlong/wezterm-nightly', file: 'wezfurlong:wezterm-nightly' }
      loop_control:
        label: "{{ item.repo }}"

# ---------------------------------------------------------------- Ubuntu
- name: Ubuntu third-party repositories
  when: ansible_facts['os_family'] == 'Debian'
  block:
    # deb822_repository needs python3-debian, and downloads each signed_by key itself.
    - name: Install python3-debian
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Add apt repositories
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.uri }}"
        suites: "{{ item.suite }}"
        components: "{{ item.components }}"
        architectures: amd64
        signed_by: "{{ item.key }}"
      loop:
        - { name: vscode, uri: 'https://packages.microsoft.com/repos/vscode', suite: stable, components: main, key: 'https://packages.microsoft.com/keys/microsoft.asc' }
        - { name: github-cli, uri: 'https://cli.github.com/packages', suite: stable, components: main, key: 'https://cli.github.com/packages/githubcli-archive-keyring.asc' }
        - { name: google-chrome, uri: 'https://dl.google.com/linux/chrome/deb/', suite: stable, components: main, key: 'https://dl.google.com/linux/linux_signing_key.pub' }
        - { name: 1password, uri: 'https://downloads.1password.com/linux/debian/amd64', suite: stable, components: main, key: 'https://downloads.1password.com/linux/keys/1password.asc' }
        - { name: wezterm, uri: 'https://apt.fury.io/wez/', suite: '*', components: '*', key: 'https://apt.fury.io/wez/gpg.key' }
      loop_control:
        label: "{{ item.name }}"
