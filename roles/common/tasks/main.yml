---
- name: Update all packages (Fedora)
  ansible.builtin.dnf:
    name: '*'
    state: latest
  when: ansible_facts['os_family'] == 'RedHat'
  tags: ['upgrade']

- name: Update all packages (Ubuntu)
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ['upgrade']

- name: Install base CLI packages (Fedora)
  ansible.builtin.dnf:
    name: "{{ packages_base_fedora }}"
    state: present
    allowerasing: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install base CLI packages (Ubuntu)
  ansible.builtin.apt:
    name: "{{ packages_base_ubuntu }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Change login shell to zsh
  ansible.builtin.user:
    name: "{{ user_name }}"
    shell: /usr/bin/zsh

# Windows uses RealTimeIsUniversal=1 with w32time disabled so Linux owns the RTC in UTC.
- name: Set hardware clock to UTC
  ansible.builtin.command: timedatectl set-local-rtc 0
  changed_when: false

# BeaconDB Wi-Fi BSSID lookups time out and mis-locate moved neighbor routers to MST/MDT.
- name: Configure GeoClue to use Positon GeoIP without Wi-Fi BSSID scanning
  ansible.builtin.copy:
    dest: /etc/geoclue/conf.d/99-positon.conf
    mode: "0644"
    content: |
      [ip]
      enable=true
      method=ichnaea
      url=https://api.positon.xyz/v1/geolocate?key=56aba903-ae67-4f26-919b-15288b44bda9

      [wifi]
      enable=false
      url=https://api.positon.xyz/v1/geolocate?key=56aba903-ae67-4f26-919b-15288b44bda9

- name: Stop GNOME Software from downloading updates in the background
  ansible.builtin.systemd:
    name: packagekit
    enabled: false
    masked: true
    state: stopped
  failed_when: false

# Let `sudo` prompt via GUI when invoked with no tty,
# e.g. from an agent session's `! sudo ...`.
- name: Configure SUDO_ASKPASS for GUI sudo prompts without a tty
  ansible.builtin.copy:
    dest: /etc/profile.d/sudo-askpass.sh
    content: |
      export SUDO_ASKPASS=/usr/libexec/openssh/ssh-askpass
    mode: "0644"
  when: ansible_facts['os_family'] == 'RedHat'
