---
- name: Add Gundu Labs repository
  become: true
  ansible.builtin.yum_repository:
    name: gundulabs
    description: Gundu Labs
    baseurl: https://packages.gundulabs.com/rpm/fedora/$releasever/$basearch
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: https://packages.gundulabs.com/keys/gundulabs-repo.asc

- name: Install Gaze packages
  become: true
  ansible.builtin.dnf:
    name:
      - gaze
      - gaze-gui
      - gaze-gnome-extension
    # Fast-moving project; 0.3.4 fixed the GDM keyring unlock and IR camera hand-off hangs.
    state: latest

- name: Enable and start gazed service
  become: true
  ansible.builtin.systemd:
    name: gazed
    enabled: true
    state: started

- name: Create custom authselect profile to fix GDM typing loop
  become: true
  ansible.builtin.command: authselect create-profile custom-gaze -b gaze
  args:
    creates: /etc/authselect/custom/custom-gaze

- name: Remove pam_gaze.so from password-auth in custom profile
  become: true
  ansible.builtin.lineinfile:
    path: /etc/authselect/custom/custom-gaze/password-auth
    regexp: 'pam_gaze\.so'
    state: absent

- name: Select custom authselect profile for Gaze
  become: true
  ansible.builtin.command: authselect select custom/custom-gaze with-silent-lastlog with-mdns4 with-pam-gnome-keyring --force
  register: authselect_gaze
  changed_when: "'Profile \"custom/custom-gaze\" was selected.' in authselect_gaze.stdout"

- name: Enable face authentication in Gaze GNOME extension
  become: false
  ansible.builtin.command: gsettings set org.gnome.shell.extensions.gaze enable-face-authentication true
  changed_when: false


- name: Configure Gaze settings
  become: true
  ansible.builtin.lineinfile:
    path: /etc/gaze/config.toml
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: 'require_confirmation_lock_screen', value: 'false' }
    - { key: 'encrypt_templates', value: 'true' }
    - { key: 'unlock_gnome_keyring', value: 'true' }
