---
- name: Install hardware tools (Fedora)
  ansible.builtin.dnf:
    name:
      - solaar          # Logitech Unifying
      - coolercontrol   # fan curves (copr codifryed/CoolerControl)
      - fprintd
      - fprintd-pam
      - v4l-utils
      - brightnessctl
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install hardware tools (Ubuntu)
  ansible.builtin.apt:
    name:
      - solaar
      - coolercontrol
      - fprintd
      - libpam-fprintd
      - v4l-utils
      - brightnessctl
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  ignore_errors: true

- name: Enable coolercontrold
  ansible.builtin.systemd:
    name: coolercontrold
    enabled: true
    state: started
  failed_when: false

# --- Fingerprint reader -------------------------------------------------
- name: Keep the ELAN fingerprint reader out of USB autosuspend
  ansible.builtin.copy:
    src: 60-fprint-no-autosuspend.rules
    dest: /etc/udev/rules.d/60-fprint-no-autosuspend.rules
    owner: root
    group: root
    mode: '0644'
  register: fprint_udev

- name: Reload udev and re-trigger the fingerprint reader
  ansible.builtin.shell: |
    udevadm control --reload-rules
    udevadm trigger --subsystem-match=usb --attr-match=idVendor=04f3
  when: fprint_udev.changed
  changed_when: true

- name: Power on the live fingerprint device now
  ansible.builtin.shell: |
    set -e
    for d in /sys/bus/usb/devices/*/; do
      if [ -f "$d/idVendor" ] && [ "$(cat "$d/idVendor")" = "04f3" ] \
         && [ "$(cat "$d/idProduct" 2>/dev/null)" = "0c11" ]; then
        echo on > "$d/power/control"
      fi
    done
  when: fprint_udev.changed
  changed_when: true

- name: Enable fingerprint auth in authselect (Fedora)
  ansible.builtin.shell: |
    authselect enable-feature with-fingerprint
    authselect apply-changes
  when: ansible_facts['os_family'] == 'RedHat'
  register: authselect_fp
  changed_when: "'No existing configuration' not in authselect_fp.stderr"
  failed_when: false

# --- NVIDIA -------------------------------------------------------------
- name: Detect NVIDIA GPU
  ansible.builtin.shell: lspci | grep -i 'nvidia'
  register: nvidia_gpu
  changed_when: false
  failed_when: false

- name: Install NVIDIA drivers (Fedora)
  ansible.builtin.dnf:
    name:
      - akmod-nvidia
      - xorg-x11-drv-nvidia-cuda
      - nvidia-settings
      - kernel-devel
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - nvidia_gpu.rc == 0

- name: Install NVIDIA drivers (Ubuntu)
  ansible.builtin.apt:
    name:
      - nvidia-driver-580
      - nvidia-settings
    state: present
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nvidia_gpu.rc == 0
  ignore_errors: true
