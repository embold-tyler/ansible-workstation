---
# Sort localhost into os_<family> so each play below only runs on its own OS.
- name: Detect operating system
  hosts: localhost
  connection: local
  gather_facts: true
  # always: a --tags run would otherwise skip the grouping and match no play.
  tags: ['always']
  tasks:
    - name: Fail early on unsupported OS family
      ansible.builtin.assert:
        that: ansible_facts['os_family'] in ['RedHat', 'Debian', 'Darwin']
        fail_msg: "Only Fedora, Ubuntu (best-effort) and macOS are supported."

    - name: Group by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"

- name: Configure Linux Workstation (Fedora primary, Ubuntu best-effort)
  hosts: os_RedHat:os_Debian
  connection: local
  become: true

  pre_tasks:

    - name: Speed up dnf (Fedora)
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^max_parallel_downloads='
        line: 'max_parallel_downloads=10'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Ensure flatpak is installed
      ansible.builtin.package:
        name: flatpak
        state: present

    - name: Add Flathub repository
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo

  roles:
    - role: repos
      tags: ['repos']
    - role: common
      tags: ['base', 'common']
    - role: hardware
      tags: ['hardware']
    - role: desktop
      tags: ['apps', 'desktop']
    - role: development
      tags: ['dev', 'development']
    - role: luks_tpm
      tags: ['luks', 'encryption']
    - role: gaze
      tags: ['gaze', 'biometrics']
    - role: gnome
      tags: ['gnome', 'desktop']
      become: false
    - role: dotfiles
      tags: ['dotfiles']
      become: false

  post_tasks:
    - name: Manual follow-up steps
      ansible.builtin.debug:
        msg:
          - "Provisioning complete."
          - "1. Log out/in (or reboot) so the zsh shell change and nvidia kmod take effect."
          - "3. Sign in to 1Password, then:  op plugin init gh"
          - "4. Authenticate Coder:  coder login https://coder.embold.dev"
          - "5. Re-install your Chrome web apps (Figma included) from inside"
          - "   Chrome (three-dot menu > Cast, save and share > Install page"
          - "   as app)."
          - "6. Log out and back in: new GNOME extensions and the SSH agent"
          - "   change only take effect in a fresh session."
          - "7. Install Vicinae extensions from the checklist in README.md"
          - "   (Launcher > Extensions) - no CLI for this exists yet."
          - "8. If you have an IR camera for face unlock, enroll your face: gaze add-face <name>, then sudo gaze keyring"

# Homebrew refuses to run as root, so this play runs as the login user and
# individual tasks opt into become. Run it WITHOUT --ask-become-pass: the macos
# role prompts once and reuses the password for sudo and for casks that need it.
- name: Configure macOS Workstation
  hosts: os_Darwin
  connection: local
  become: false

  roles:
    - role: macos
      tags: ['macos', 'apps', 'desktop']
    - role: development
      tags: ['dev', 'development']
    - role: dotfiles
      tags: ['dotfiles']

  post_tasks:
    - name: Manual follow-up steps
      ansible.builtin.debug:
        msg:
          - "Provisioning complete."
          - "1. Sign in to 1Password, enable Settings > Developer > SSH agent, then:  op plugin init gh"
          - "2. Authenticate Coder:  coder login {{ coder_url }}"
          - "3. Open Herd once to finish its setup (it adds php/composer to ~/Library/Application Support/Herd/bin)."
          - "4. Open Podman Desktop and start the Podman machine."
          - "5. Raycast: set its hotkey to Cmd+Space (Spotlight's is disabled), clipboard history"
          - "   to Cmd+Shift+V, and import snippets (see README 'macOS > Raycast')."
          - "6. iTerm2: Settings > Profiles shows the managed 'Catppuccin' profile as default."
          - "7. External PC keyboard: System Settings > Keyboard > Keyboard Shortcuts > Modifier Keys"
          - "   if you want Alt/Win swapped (by default Win = Cmd, Alt = Option)."
          - "8. If FileVault was reported off above, turn it on in System Settings > Privacy & Security."
